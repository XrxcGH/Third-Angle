# Drop-in for the litestream.service that Litestream's own .deb installs.
#
# /etc/litestream.yml names the bucket and its credentials as $R2_BUCKET,
# $R2_ACCOUNT_ID, $R2_ACCESS_KEY_ID and $R2_SECRET_ACCESS_KEY, and Litestream
# expands those from its own process environment. The packaged unit knows
# nothing about /etc/third-angle/env, so without this file the service starts
# with all four empty and replicates nowhere -- while still reporting itself
# active, which is the worst shape a backup failure can take.
#
# This installs to /etc/systemd/system/litestream.service.d/env.conf rather than
# editing the packaged unit, so a Litestream upgrade cannot quietly revert it.

[Service]
EnvironmentFile=/etc/third-angle/env
