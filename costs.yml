# Single source of truth for every price in this project. Risk R9.
#
# Prices age, and a number quoted in prose ages invisibly. Every price in this
# project lives here and nowhere else, so a number cannot exist in two places
# and disagree.
#
# `evidence` must be the exact string as it appears on the vendor page.
# `volatile: true` shortens the staleness window from 180 days to 90.
#
# Check with: npm run check:costs

items:
  - name: Compute and disk
    vendor: Oracle Cloud Infrastructure
    product: Always Free, VM.Standard.A1.Flex, 2 OCPU / 12 GB, arm64
    amount_usd: 0
    period: year
    source_url: https://docs.oracle.com/en-us/iaas/Content/FreeTier/freetier_topic-Always_Free_Resources.htm
    verified_on: 2026-08-21
    volatile: true
    evidence: "For Always Free tenancies, this is equivalent to 2 OCPUs and 12 GB of memory."
    note: >
      Halved from 4 OCPU / 24 GB on 15 June 2026 with no announcement. Treat the
      box as disposable and the backup as the system of record. Re-read this page
      every 15 June.

  - name: DNS, TLS, cache, and WAF
    vendor: Cloudflare
    product: Free plan
    amount_usd: 0
    period: year
    source_url: https://www.cloudflare.com/plans/
    verified_on: 2026-08-23
    volatile: true
    evidence: "Free"
    note: >
      The front half of the stack: proxied DNS, a universal certificate, edge
      caching, the free managed WAF ruleset, one rate-limiting rule, and the
      tunnel that removes every inbound port from the origin. Cloudflare Tunnel
      is free and unmetered on this plan.

  - name: Domain
    vendor: Squarespace Domains
    product: ericjdean.com, registered 23 August 2026
    amount_usd: 20.00
    period: year
    source_url: https://whatsquare.space/blog/squarespace-domain-renewal-cost
    verified_on: 2026-08-23
    volatile: true
    evidence: ".com $20/year"
    note: >
      NOT read from the vendor. Squarespace publishes no public price sheet for
      any TLD, so the figure is confirmed only at checkout and at renewal, and
      this line is a third party reading rather than a quotation. Check the
      renewal notice against it.

      WHOIS privacy and SSL are included, so there is nothing to add.

      Worth revisiting after 25 October 2026, when the 60 day ICANN transfer
      lock from registration lifts: Cloudflare Registrar sells at registry cost,
      which is about 10.46 for a .com, so a transfer roughly halves this. The
      zone is already on Cloudflare's nameservers for the tunnel, the WAF and
      Email Routing, so a transfer moves the billing and nothing else. Note that
      the Verisign registry fee rises to 10.97 on 1 November 2026 at 04:00 UTC.

  - name: Media storage
    vendor: Cloudflare
    product: R2 Standard, free tier
    amount_usd: 0
    period: year
    source_url: https://developers.cloudflare.com/r2/pricing/
    verified_on: 2026-08-21
    volatile: true
    evidence: "10 GB-month"
    note: Zero egress. The whole document set is well under this.

  - name: Animated icons
    vendor: Lordicon
    product: Free plan
    amount_usd: 0
    period: year
    source_url: https://lordicon.com/pricing
    verified_on: 2026-08-21
    volatile: true
    evidence: "Attribution needed"
    note: >
      Commercial use permitted with a visible credit, which goes on /attributions
      alongside the OFL font notices. PRO at 96/year buys removal of that one line
      and nothing else. Do NOT use the Academic licence: it grants the full library
      but explicitly prohibits commercial projects.

  - name: Email, inbound
    vendor: Cloudflare
    product: Email Routing
    amount_usd: 0
    period: year
    source_url: https://developers.cloudflare.com/email-routing/limits/
    verified_on: 2026-08-21
    volatile: true
    evidence: "200 email rules per domain"
    note: Requires the zone to use Cloudflare nameservers, which the registrar choice already satisfies.

  - name: Email, outbound
    vendor: Brevo
    product: Free plan, SMTP relay
    amount_usd: 0
    period: year
    source_url: https://www.brevo.com/pricing/
    verified_on: 2026-08-23
    volatile: true
    evidence: "Free"
    note: >
      An SMTP relay rather than a mailbox, which is the only thing the site
      needs: src/mailer.js is a submission client, not a mail server. It speaks
      STARTTLS on 587 and AUTH PLAIN or LOGIN, which is what Brevo offers.

      NOT read from the vendor: the daily send allowance on the free plan was
      not verifiable at the time of writing and is believed to be about 300 a
      day, which a contact form does not approach. Confirm it, and confirm that
      the free plan appends nothing to TRANSACTIONAL mail, before relying on it.

      Chosen over Zoho Mail Forever Free, which ships with no SMTP relay at all,
      and over Gmail, which cannot send as this domain and whose third-party
      Send as Google removes in January 2027. Brevo authenticates ericjdean.com
      with DKIM and SPF records added at Cloudflare, so mail comes from the
      domain rather than from a personal account. Pre-approved escape hatch if
      the free plan changes: Purelymail at about 10/year or Migadu Micro at
      19/year.

  - name: Analytics
    vendor: Cloudflare
    product: Web Analytics
    amount_usd: 0
    period: year
    source_url: https://www.cloudflare.com/web-analytics/
    verified_on: 2026-08-21
    volatile: false
    evidence: "privacy-first analytics"
    note: Cookieless, so no consent banner obligation and no pageview cap.

  - name: Uptime monitoring
    vendor: UptimeRobot
    product: Free
    amount_usd: 0
    period: year
    source_url: https://uptimerobot.com/pricing/
    verified_on: 2026-08-21
    volatile: true
    evidence: "50 monitors"
    note: Three monitors, one of them a keyword check asserting a real project title renders.

  - name: Backup heartbeats
    vendor: Healthchecks.io
    product: Hobbyist
    amount_usd: 0
    period: year
    source_url: https://healthchecks.io/pricing/
    verified_on: 2026-08-21
    volatile: true
    evidence: "20 checks"
    note: Three checks used of twenty.

  - name: CI
    vendor: GitHub
    product: Actions, public repository, Free plan
    amount_usd: 0
    period: year
    source_url: https://docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions
    verified_on: 2026-08-21
    volatile: false
    evidence: "2,000 minutes per month"
    note: >
      The repository is public. Nothing runs in Actions: there is no .github
      directory in the tree. Backup verification runs on the box from
      deploy/third-angle-backup.timer, so the 60-day auto-disable rule for
      scheduled workflows on public repositories does not reach it.

fallback_host:
  name: Hetzner CAX11
  amount_usd: 91.08
  period: year
  source_url: https://www.hetzner.com/cloud/
  verified_on: 2026-08-21
  note: >
    2 vCPU, 4 GB, arm64, 6.99/month plus 0.60 for the primary IPv4, excluding VAT.
    Chosen over cheaper x86 because arm64 matches the Ampere target, so one
    provisioning script covers both. Prices come from Hetzner's price-adjustment
    document rather than a live order page, so confirm now rather than during an
    emergency.

totals:
  year_one_usd: 10.46
  subsequent_years_usd: 0
  note: Zero after year one only if the ten-year domain renewal is prepaid before 1 November 2026.
